name: iOS gate

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: "macOS runner label; blank means the arm64 default. Pass macos-26-intel when the arm64 pool is starved."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Plan and workflow checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate plan, workflow and scripts
        shell: bash
        run: |
          set -o pipefail
          bash scripts/check-plan.sh
          bash scripts/check-workflow.sh
          bash scripts/check-evidence.sh
          bash scripts/check-project.sh
          for f in scripts/*.sh; do bash -n "$f"; done

  ios:
    name: Build, test and launch (iPad simulator)
    needs: static
    # Arm64 (macos-26) is the default and stays the default: its simulators are
    # native and fast, and it is the architecture the app ships to. The Intel
    # image exists only as a deliberate fallback for when the arm64 pool is
    # starved. Both outcomes are recorded here so nobody has to rediscover them.
    #
    # Arm64, 2026-11-13: thirteen runner_id-0 zero-step cancellations across five
    # runs, each queued exactly 15 minutes and never given a runner. Capacity,
    # not code - the loop was abandoned as a strategy rather than repeated.
    #
    # Intel, same day: runners are granted instantly. Run 43455338992 was killed
    # by the job's own 45-minute ceiling; run 43500133294's test step ran 114
    # minutes and was still executing when a 120-minute ceiling cut it, result
    # bundle incomplete. Neither produced a log, so neither was evidence. The
    # ceiling was raised to 180 minutes from that measurement, and run
    # 43519068321 (head 8c4725d) reached a real conclusion in 143 minutes: the
    # branch compiled for the first time and the suite ran to the end with 8
    # failures - four real ones, fixed at their cause (an Intel snapshot digest
    # that had never been rendered, a benchmark budget that only described
    # arm64, an antialiasing floor probed on a different GPU, and a test premise
    # that contradicted the bench sample), and four dropped-tap / app-launch
    # timeouts in UI tests the phase never touched. That is the trade recorded
    # here: Intel is roughly 2.5 hours per attempt and several times slower than
    # arm64, so it proves compilation and assertion level, not interactive
    # performance.
    #
    # Dispatch a starved arm64 run with `-f runner=macos-26-intel`; leave the
    # input blank to keep the arm64 default that push and pull_request use.
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 180
    env:
      PROJECT: FacetForge.xcodeproj
      SCHEME: FacetForge
      DERIVED: ${{ github.workspace }}/.build/DerivedData
      RESULT: ${{ github.workspace }}/.build/Test.xcresult
      LOG: ${{ github.workspace }}/.build/xcodebuild.log
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          fi
          xcodebuild -version

      - name: Detect Xcode project
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build
          if [ -d "$PROJECT" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Phase 0 skeleton: no $PROJECT yet. Static gate only; phase 1 turns on the build."
          fi

      - name: Validate project and scheme
        if: steps.detect.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -list -project "$PROJECT" -json | tee .build/xcodebuild-list.json

      - name: Select an available iPad simulator
        id: sim
        if: steps.detect.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j | ruby -rjson -e '
            devices = JSON.parse(STDIN.read)["devices"]
            pick = nil
            devices.each do |runtime, list|
              next unless runtime.include?("iOS")
              list.each { |d| pick = d if pick.nil? && d["name"].match?(/iPad/) }
            end
            puts(pick ? pick["udid"] : "")
          ')
          if [ -z "$udid" ]; then
            echo "::error::No available iPad simulator on this runner image."
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b

      - name: Build and run unit/UI tests
        if: steps.detect.outputs.present == 'true'
        shell: bash
        run: |
          set -o pipefail
          rm -rf "$RESULT"
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$DERIVED" \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            -resultBundlePath "$RESULT" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 240 \
            -maximum-test-execution-time-allowance 600 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee "$LOG"

      - name: Verify tests actually executed
        if: steps.detect.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -Eq 'Executed [1-9][0-9]* tests?, with 0 failures' "$LOG"; then
            echo "::error::xcodebuild exited without executing any passing tests. A green gate with zero tests is not a gate."
            grep -E 'Executed|Test Suite|error:|failed' "$LOG" | tail -80 || true
            exit 1
          fi
          grep -E 'Executed [1-9][0-9]* tests?, with 0 failures' "$LOG" | tail -5

      - name: Export screenshots from xcresult
        if: always() && steps.detect.outputs.present == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build/attachments
          xcrun xcresulttool export attachments --path "$RESULT" --output-path .build/attachments
          find .build/attachments -maxdepth 1 -type f -exec ls -l {} \;

      - name: Simulator launch smoke and screenshot
        if: steps.detect.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
          app=$(find "$DERIVED/Build/Products" -name 'FacetForge.app' -type d | head -1)
          if [ -z "$app" ]; then
            echo "::error::No FacetForge.app product found after build."
            exit 1
          fi
          bundle=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$app"
          xcrun simctl launch --terminate-running-process "${{ steps.sim.outputs.udid }}" "$bundle" | tee .build/launch.txt
          sleep 5
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot .build/smoke.png
          test -s .build/smoke.png
          sips -g pixelWidth -g pixelHeight .build/smoke.png

      - name: Upload test results and screenshot
        if: always() && steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-results
          path: |
            .build/Test.xcresult
            .build/xcodebuild.log
            .build/xcodebuild-list.json
            .build/launch.txt
            .build/smoke.png
            .build/attachments
          if-no-files-found: warn
